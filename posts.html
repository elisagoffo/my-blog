<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container mt-5">
    <h1 class="header-primary">All Posts</h1>
    <ul>
      <li><a href="post1.html" class="link-primary">Example Post 1</a> – <span class="content-secondary">Aug 27, 2025</span></li>
      <li><a href="post2.html" class="link-secondary">Example Post 2</a> – <span class="content-secondary">Aug 28, 2025</span></li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => { document.getElementById("navbar").innerHTML = data; });
  </script>
</body>
</html>
