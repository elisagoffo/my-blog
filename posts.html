<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar placeholder -->
  <div id="navbar"></div>

  <div class="container mt-5">
    <h1 class="header-primary mb-4">Blog Posts</h1>
    <ul id="post-list" class="list-group"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Load shared navbar
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => { document.getElementById("navbar").innerHTML = data; });

    // Posts database
    const posts = [
      { title: "Example Post 1", date: "2025-08-27", file: "post1.html" },
      { title: "Example Post 2", date: "2025-08-30", file: "post2.html" },
      { title: "Example Post 3", date: "2025-09-02", file: "post3.html" }
    ];

    // Sort posts newest → oldest
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));

    // Render posts
    const postList = document.getElementById("post-list");
    posts.forEach(post => {
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";

      li.innerHTML = `
        <a href="${post.file}" class="content-primary">${post.title}</a>
        <span class="badge bg-secondary">${post.date}</span>
      `;

      postList.appendChild(li);
    });
  </script>
</body>
</html>
